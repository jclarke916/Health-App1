name = "centurion-cloud"
main = "centurion-cloud.js"
compatibility_date = "2026-09-01"

# Created with: npx wrangler d1 create centurion
# Paste the database_id printed by that command here before deploying.
[[d1_databases]]
binding = "DB"
database_name = "centurion"
database_id = "PASTE_DATABASE_ID_HERE"

# Secrets are NOT in this file. Set them once, each prompts for the value:
#   npx wrangler secret put HOUSEHOLD_KEY
#   npx wrangler secret put OURA_CLIENT_ID
#   npx wrangler secret put OURA_CLIENT_SECRET
